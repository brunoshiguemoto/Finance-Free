<!-- ============================================================================
     FINANCE FREE - ESTRUTURA PRINCIPAL DO APLICATIVO (HTML5)
     Arquivo: index.html.txt
     Descrição: Layout responsivo preparado para PWA / Android & iOS
     ============================================================================ -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance Free</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Chart.js para o Gráfico de Pizza -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <!-- CABEÇALHO & GAMIFICAÇÃO -->
  <header class="app-header">
    <div class="user-badge">
      <div class="avatar">BS</div>
      <div>
        <h4 style="font-size: 0.95rem;">Bruno Shiguemoto</h4>
        <span style="font-size: 0.75rem; color: #94a3b8;">Plano Familiar</span>
      </div>
    </div>
    <div class="gamification-pill">
      🏆 <span id="pontosTotal">100 pts</span>
    </div>
  </header>

  <!-- SELETOR DE MÊS -->
  <div class="month-selector">
    <button class="month-btn" onclick="mudarMes(-1)">◀</button>
    <h3 id="displayMes">Setembro 2026</h3>
    <button class="month-btn" onclick="mudarMes(1)">▶</button>
  </div>

  <!-- CARDS DE RESUMO -->
  <div class="summary-cards">
    <div class="card">
      <div class="card-title">Receitas do Mês</div>
      <div class="card-value value-receita" id="totalReceitas">R$ 0,00</div>
    </div>
    <div class="card">
      <div class="card-title">Despesas do Mês</div>
      <div class="card-value value-despesa" id="totalDespesas">R$ 0,00</div>
    </div>
  </div>

  <!-- GRÁFICO EM PIZZA DAS DESPESAS -->
  <section class="chart-container">
    <h4 style="font-size: 0.9rem; color: #94a3b8; margin-bottom: 10px;">MAIORES GASTOS DO MÊS</h4>
    <div class="chart-wrapper">
      <canvas id="despesasChart"></canvas>
    </div>
  </section>

  <!-- NAVEGAÇÃO INFERIOR -->
  <nav class="bottom-nav">
    <a href="#" class="nav-item active">📊 <span>Home</span></a>
    <a href="#" class="nav-item">🏦 <span>Contas</span></a>
    <button class="btn-add-floating" onclick="alert('Lançamento Rápido')">+</button>
    <a href="#" class="nav-item">💳 <span>Cartões</span></a>
    <a href="#" class="nav-item">🏅 <span>Medalhas</span></a>
  </nav>

  <!-- SCRIPTS -->
  <script src="bancos_brasil.js"></script>
  <script src="app.js"></script>
</body>
</html>
